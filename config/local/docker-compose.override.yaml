services:
  redis:
    ports:
      - "6379:6379"

  frontend:
    build:
      target: build
    command: ["npm", "run", "dev"]
    volumes:
      - ./frontend:/frontend
      - /frontend/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    ports:
      - "5173:5173"

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite --blobHost 0.0.0.0 --skipApiVersionCheck
    ports:
      - "10000:10000"
    networks:
      - backend
