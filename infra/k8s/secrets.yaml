# Secrets: Sensitive configuration data (passwords, connection strings)
# Values are base64-encoded (NOT encrypted - use external secret managers in production)
#
# To encode values:
#   echo -n "your-value" | base64
#
# To decode:
#   echo "base64-string" | base64 -d
#
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: content-automation
  labels:
    app: content-engine
type: Opaque
data:
  # PostgreSQL connection details (base64 encoded)
  # Actual values:
  #   POSTGRES_HOST: host.docker.internal
  #   POSTGRES_PORT: 5432
  #   POSTGRES_DB: content_automation_db
  #   POSTGRES_USER: admin
  #   POSTGRES_PASSWORD: local_dev_password

  POSTGRES_HOST: aG9zdC5kb2NrZXIuaW50ZXJuYWw=
  POSTGRES_PORT: NTQzMg==
  POSTGRES_DB: Y29udGVudF9hdXRvbWF0aW9uX2Ri
  POSTGRES_USER: YWRtaW4=
  POSTGRES_PASSWORD: bG9jYWxfZGV2X3Bhc3N3b3Jk

---
