# Example: How to use the ConfigMap and Secret in a deployment
# This shows how your microservices should reference the shared config

apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-service
  namespace: content-automation
spec:
  replicas: 2
  selector:
    matchLabels:
      app: example-service
  template:
    metadata:
      labels:
        app: example-service
    spec:
      containers:
      - name: example-service
        image: your-registry/example-service:latest
        ports:
        - containerPort: 8000

        # Method 1: Load ALL ConfigMap values as environment variables
        envFrom:
        - configMapRef:
            name: shared-config

        # Method 2: Load specific values + Secret values
        env:
        # From ConfigMap
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: shared-config
              key: ENVIRONMENT

        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: shared-config
              key: LOG_LEVEL

        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: shared-config
              key: REDIS_URL

        # From Secret
        - name: POSTGRES_HOST
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: POSTGRES_HOST

        - name: POSTGRES_PORT
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: POSTGRES_PORT

        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: POSTGRES_DB

        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: POSTGRES_USER

        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: POSTGRES_PASSWORD

        # Your app can construct the database URL:
        # postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}

        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: example-service
  namespace: content-automation
spec:
  selector:
    app: example-service
  ports:
  - port: 8000
    targetPort: 8000
  type: ClusterIP
