# Production overrides
# Deploy with: helm install content-engine ./helm/content-engine -f helm/content-engine/values-prod.yaml

global:
  namespace: content-engine-prod
  environment: production
  imageRegistry: "your-prod-registry.io"
  imagePullPolicy: Always

configMap:
  LOG_LEVEL: INFO
  ENVIRONMENT: production
  DB_HOST: postgres
  DB_PORT: "5432"

# Production PostgreSQL with more resources
postgres:
  enabled: true
  storage: 100Gi
  resources:
    requests:
      memory: "2Gi"
      cpu: "1000m"
    limits:
      memory: "4Gi"
      cpu: "2000m"

# Production Redis with more resources
redis:
  enabled: true
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "1000m"

# Scale services for production load
services:
  management-api:
    replicas: 3
    tag: v1.0.0
    serviceType: LoadBalancer
    resources:
      requests:
        memory: "512Mi"
        cpu: "250m"
      limits:
        memory: "1Gi"
        cpu: "1000m"

  scheduler:
    replicas: 2  # Redundancy
    tag: v1.0.0

  content-producer:
    replicas: 10  # High load
    tag: v1.0.0
    resources:
      requests:
        memory: "1Gi"
        cpu: "500m"
      limits:
        memory: "2Gi"
        cpu: "2000m"

  visual-composer:
    replicas: 5
    tag: v1.0.0
    resources:
      requests:
        memory: "1Gi"
        cpu: "500m"
      limits:
        memory: "2Gi"
        cpu: "1000m"

  promotion-orchestrator:
    replicas: 3
    tag: v1.0.0

  analytics-collector:
    replicas: 2
    tag: v1.0.0

  publication-worker:
    replicas: 5
    tag: v1.0.0

  activity-reporter:
    replicas: 3
    tag: v1.0.0

  template-service:
    replicas: 3
    tag: v1.0.0
