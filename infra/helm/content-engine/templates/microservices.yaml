{{- range $name, $service := .Values.services }}
{{- if $service.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    {{- include "content-engine.labels" $ | nindent 4 }}
    app: {{ $name }}
spec:
  replicas: {{ $service.replicas }}
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
    spec:
      containers:
      - name: {{ $name }}
        image: {{ $.Values.global.imageRegistry }}/{{ $service.image }}:{{ $service.tag | default "latest" }}
        imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
        {{- if $service.port }}
        ports:
        - containerPort: {{ $service.port }}
        {{- end }}
        envFrom:
        - configMapRef:
            name: shared-config
        env:
        {{- range $key, $value := $service.env }}
        - name: {{ $key }}
          value: {{ $value | quote }}
        {{- end }}
        {{- if has "db-credentials" $service.secrets }}
        - name: POSTGRES_DB_NAME
          valueFrom:
            secretKeyRef:
              name: {{ $.Values.secrets.dbCredentials.name }}
              key: POSTGRES_DB_NAME
        - name: APP_DB_USER
          valueFrom:
            secretKeyRef:
              name: {{ $.Values.secrets.dbCredentials.name }}
              key: APP_DB_USER
        - name: APP_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ $.Values.secrets.dbCredentials.name }}
              key: APP_DB_PASSWORD
        {{- end }}
        {{- if has "openai-api-key" $service.secrets }}
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ $.Values.secrets.openaiApiKey.name }}
              key: {{ $.Values.secrets.openaiApiKey.key }}
        {{- end }}
        {{- if has "azure-blob-storage" $service.secrets }}
        - name: AZURE_BLOB_STORAGE_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              name: {{ $.Values.secrets.azureBlobStorage.name }}
              key: {{ $.Values.secrets.azureBlobStorage.key }}
        {{- end }}
        {{- if has "azure-foundry-api-key" $service.secrets }}
        - name: AZURE_FOUNDRY_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ $.Values.secrets.azureFoundryApiKey.name }}
              key: {{ $.Values.secrets.azureFoundryApiKey.key }}
        {{- end }}
        resources:
          {{- toYaml $service.resources | nindent 10 }}
---
{{- if $service.port }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    {{- include "content-engine.labels" $ | nindent 4 }}
    app: {{ $name }}
spec:
  selector:
    app: {{ $name }}
  ports:
  - port: {{ $service.port }}
    targetPort: {{ $service.port }}
  type: {{ $service.serviceType | default "ClusterIP" }}
{{- end }}
{{- end }}
{{- end }}
