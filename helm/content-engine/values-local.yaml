# Local development overrides
# Deploy with: helm install content-engine ./helm/content-engine -f helm/content-engine/values-local.yaml

global:
  environment: local
  imageRegistry: "localhost:5000"  # Local registry
  imagePullPolicy: IfNotPresent

# Use host.docker.internal to connect to databases on host machine
configMap:
  LOG_LEVEL: DEBUG
  ENVIRONMENT: local
  REDIS_URL: redis://host.docker.internal:6379
  DB_HOST: host.docker.internal
  DB_PORT: "5432"

# Disable infrastructure (use host machine instead)
redis:
  enabled: false

postgres:
  enabled: false

# Run fewer replicas locally
services:
  management-api:
    replicas: 1
    tag: dev
    serviceType: NodePort

  scheduler:
    replicas: 1
    tag: dev

  content-producer:
    replicas: 1  # Not 3
    tag: dev

  visual-composer:
    replicas: 1
    tag: dev

  promotion-orchestrator:
    replicas: 1
    tag: dev

  analytics-collector:
    replicas: 1
    tag: dev

  publication-worker:
    replicas: 1
    tag: dev

  activity-reporter:
    replicas: 1
    tag: dev

  template-service:
    replicas: 1
    tag: dev
