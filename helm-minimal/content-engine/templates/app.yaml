{{- range $name, $config := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
spec:
  replicas: {{ $config.replicas }}
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
    spec:
      containers:
      - name: {{ $name }}
        image: {{ $.Values.registry }}/{{ $name }}:latest
        ports:
        - containerPort: {{ $config.port }}
        env:
        - name: DB_HOST
          value: host.docker.internal
        - name: REDIS_URL
          value: redis://host.docker.internal:6379
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
spec:
  selector:
    app: {{ $name }}
  ports:
  - port: {{ $config.port }}
{{- end }}
