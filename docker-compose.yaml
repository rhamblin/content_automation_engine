services:
  redis:
    image: redis:latest
    restart: unless-stopped
    networks:
      - backend
      - development

  db:
    image: postgres:16-alpine3.22
    restart: unless-stopped
    environment:
      POSTGRES_USER:     "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB:       "${POSTGRES_DB_NAME}"
      APP_DB_USER:       "${APP_DB_USER}"
      APP_DB_PASSWORD:   "${APP_DB_PASSWORD}"
      ANALYTICS_DB_USER: "${ANALYTICS_DB_USER}"
      ANALYTICS_DB_PASSWORD: "${ANALYTICS_DB_PASSWORD}"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - database
      - development

  # --------------------
  # Template App Service
  # --------------------
  template-app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        SERVICE_NAME: template-app
        SERVICE_CMD: '["python","-m","app.template_service.app"]'
    env_file:
      - config/dev/variables.env
    environment:
      # Secrets are read by entrypoint.sh and exported as env vars
      AZURE_FOUNDRY_ENDPOINT: ${AZURE_FOUNDRY_ENDPOINT}
      DB_URL: postgresql+asyncpg://${APP_DB_USER}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB_NAME}
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    secrets:
      - openai-api-key
      - azure-blob-storage-connection-string
      - azure-foundry-proj-default-api-key
    depends_on:
      - redis
      - db
    networks: [backend, database]

  content-generation-scheduler:
    build:
      context: .
      dockerfile: services/content-generation-scheduler/Dockerfile
    restart: unless-stopped
    networks:
      - backend
      - development
    depends_on:
      - content-generation-dispatcher

  content-generation-worker:
    build:
      context: .
      dockerfile: services/content-generation-worker/Dockerfile
    restart: unless-stopped
    secrets:
      - openai-api-key
      - azure-blob-storage-connection-string
      - azure-foundry-proj-default-api-key
    environment:
      # Secrets are read by entrypoint.sh and exported as env vars
      AZURE_FOUNDRY_ENDPOINT: ${AZURE_FOUNDRY_ENDPOINT}
      DB_URL: postgresql+asyncpg://${APP_DB_USER}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB_NAME}
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    networks:
      - backend
      - database
      - development
    depends_on:
      - redis
      - db

  content-generation-dispatcher:
    build:
      context: .
      dockerfile: services/content-generation-dispatcher/Dockerfile
    restart: unless-stopped
    ports:
      - "8001:80"
    networks:
      - backend
      - development
    depends_on:
      - redis
      - content-generation-worker

  test-runner:
    build:
      context: .
      dockerfile: test/Dockerfile
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # Required for testcontainers
    environment:
      - TESTCONTAINERS_HOST_OVERRIDE=host.docker.internal  
    profiles:
      - test  # Only runs when explicitly requested

secrets:
  openai-api-key:
    file: ./secrets/openai-api-key.txt
  azure-blob-storage-connection-string:
    file: ./secrets/azure-blob-storage-connection-string.txt
  azure-foundry-proj-default-api-key:
    file: ./secrets/azure-foundry-proj-default-api-key.txt

volumes:
  db_data:
    name: "${APP_NAME}_${APP_ENV}_db_data"

networks:
  database:
  backend:
  development:
