services:
  redis:
    image: redis:latest
    restart: unless-stopped
    networks:
      - backend
      - development

  db:
    image: postgres:16-alpine3.22
    restart: unless-stopped
    environment:
      POSTGRES_USER:     "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB:       "${POSTGRES_DB_NAME}"
      APP_DB_USER:       "${APP_DB_USER}"
      APP_DB_PASSWORD:   "${APP_DB_PASSWORD}"
      ANALYTICS_DB_USER: "${ANALYTICS_DB_USER}"
      ANALYTICS_DB_PASSWORD: "${ANALYTICS_DB_PASSWORD}"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - database
      - development

  # --------------------
  # Template App Service
  # --------------------
  template-service:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        SERVICE_NAME: template-service
        SERVICE_CMD: '["python","-m","app.template_service.app"]'
    restart: unless-stopped
    env_file:
      - config/local/variables.env
    secrets:
      - openai-api-key
      - azure-blob-storage-connection-string
      - azure-foundry-proj-default-api-key
    depends_on:
      - redis
      - db
    networks: [backend, database]

  # content-generation-worker:
  #   build:
  #     context: .
  #     dockerfile: services/content-generation-worker/Dockerfile
  #   restart: unless-stopped
  #   secrets:
  #     - openai-api-key
  #     - azure-blob-storage-connection-string
