  db:
    image: postgres:16-alpine3.22
    restart: unless-stopped
    environment:
      POSTGRES_USER:     "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB:       "${POSTGRES_DB_NAME}"
      APP_DB_USER:       "${APP_DB_USER}"
      APP_DB_PASSWORD:   "${APP_DB_PASSWORD}"
      ANALYTICS_DB_USER: "${ANALYTICS_DB_USER}"
      ANALYTICS_DB_PASSWORD: "${ANALYTICS_DB_PASSWORD}"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - database
      - development

secrets:
  openai-api-key:
    file: ./secrets/openai-api-key.txt
  unsplash-access-key:
    file: ./secrets/unsplash-access-key.txt
  azure-blob-storage-connection-string:
    file: ./secrets/azure-blob-storage-connection-string.txt

volumes:
  db_data:
    name: "${APP_NAME}_${APP_ENV}_db_data"

networks:
  database:
  backend:
  development:
