services:
  redis:
    image: redis:latest
    restart: unless-stopped
    networks:
      - backend
      - development

  db:
    image: postgres:16-alpine3.22
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB_NAME}"
      APP_DB_USER: "${APP_DB_USER}"
      APP_DB_PASSWORD: "${APP_DB_PASSWORD}"
      ANALYTICS_DB_USER: "${ANALYTICS_DB_USER}"
      ANALYTICS_DB_PASSWORD: "${ANALYTICS_DB_PASSWORD}"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - database
      - development

  # --------------------
  # Services
  # --------------------
  template-service:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      args:
        SERVICE_NAME: template-service
    restart: unless-stopped
    env_file:
      - config/local/variables.env
    secrets:
      - openai-api-key
      - azure-foundry-proj-default-api-key
    depends_on:
      - redis
      - db
    networks: [backend, database]

  activity-reporter:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      args:
        SERVICE_NAME: activity-reporter
    restart: unless-stopped
    env_file:
      - config/local/variables.env
    secrets:
      - openai-api-key
      - azure-foundry-proj-default-api-key
    depends_on:
      - redis
      - db
    networks: [backend, database]

  analytics-collector:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      args:
        SERVICE_NAME: analytics-collector
    restart: unless-stopped
    env_file:
      - config/local/variables.env
    secrets:
      - openai-api-key
      - azure-foundry-proj-default-api-key
    depends_on:
      - redis
      - db
    networks: [backend, database]

  content-producer:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      args:
        SERVICE_NAME: content-producer
    restart: unless-stopped
    env_file:
      - config/local/variables.env
    secrets:
      - openai-api-key
      - azure-foundry-proj-default-api-key
    depends_on:
      - redis
      - db
    networks: [backend, database]

  management-api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      args:
        SERVICE_NAME: management-api
    restart: unless-stopped
    env_file:
      - config/local/variables.env
    secrets:
      - openai-api-key
      - azure-foundry-proj-default-api-key
    depends_on:
      - redis
      - db
    networks: [backend, database]

  promotion-orchestrator:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      args:
        SERVICE_NAME: promotion-orchestrator
    restart: unless-stopped
    env_file:
      - config/local/variables.env
    secrets:
      - openai-api-key
      - azure-foundry-proj-default-api-key
    depends_on:
      - redis
      - db
    networks: [backend, database]

  publication-worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      args:
        SERVICE_NAME: publication-worker
    restart: unless-stopped
    env_file:
      - config/local/variables.env
    secrets:
      - openai-api-key
      - azure-foundry-proj-default-api-key
    depends_on:
      - redis
      - db
    networks: [backend, database]

  scheduler:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      args:
        SERVICE_NAME: scheduler
    restart: unless-stopped
    env_file:
      - config/local/variables.env
    secrets:
      - openai-api-key
      - azure-foundry-proj-default-api-key
    depends_on:
      - redis
      - db
    networks: [backend, database]

  visual-composer:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      args:
        SERVICE_NAME: visual-composer
    restart: unless-stopped
    env_file:
      - config/local/variables.env
    secrets:
      - openai-api-key
      - azure-foundry-proj-default-api-key
    depends_on:
      - redis
      - db
    networks: [backend, database]

  # content-generation-worker:
  #   build:
  #     context: .
  #     dockerfile: services/content-generation-worker/Dockerfile
  #   restart: unless-stopped
  #   secrets:
  #     - openai-api-key
  #     - azure-foundry-proj-default-api-key
  #   environment:
  #     # Secrets are read by entrypoint.sh and exported as env vars
  #     AZURE_FOUNDRY_ENDPOINT: ${AZURE_FOUNDRY_ENDPOINT}
  #     DB_URL: postgresql+asyncpg://${APP_DB_USER}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB_NAME}
  #     REDIS_URL: redis://redis:6379
  #     LOG_LEVEL: ${LOG_LEVEL:-INFO}
  #     ENVIRONMENT: ${ENVIRONMENT:-development}
  #   networks:
  #     - backend
  #     - database
  #     - development
  #   depends_on:
  #     - redis
  #     - db

  test-runner:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      args:
        SERVICE_NAME: test-runner
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # Required for testcontainers
      - ./test:/app/test  # Mount test files
      - ./pytest.ini:/app/pytest.ini  # Pytest config
    environment:
      - TESTCONTAINERS_HOST_OVERRIDE=host.docker.internal
    command: ["pytest", "test/", "-v"]
    profiles:
      - test  # Only runs when explicitly requested
    networks:
      - backend
      - database

secrets:
  openai-api-key:
    file: ./secrets/openai-api-key.txt
  azure-foundry-proj-default-api-key:
    file: ./secrets/azure-foundry-proj-default-api-key.txt

volumes:
  db_data:
    name: "${APP_NAME}_${APP_ENVIRONMENT}_db_data"

networks:
  database:
  backend:
  development:
