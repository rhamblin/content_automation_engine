services:
  redis:
    image: redis:latest
    restart: unless-stopped
    networks:
      - backend
      - development

  post-generation-scheduler:
    build:
      context: .
      dockerfile: services/post-generation-scheduler/Dockerfile
    restart: unless-stopped
    networks:
      - backend
      - development
    depends_on:
      - post-dispatcher

  post-worker:
    build:
      context: .
      dockerfile: services/post-worker/Dockerfile
    restart: unless-stopped
    secrets:
      - openai-api-key
      - unsplash-access-key
      - azure-blob-storage-connection-string
    environment:
      OPENAI_API_KEY: /run/secrets/openai-api-key
      UNSPLASH_ACCESS_KEY: /run/secrets/unsplash-access-key
      AZURE_BLOB_STORAGE_CONNECTION_STRING: /run/secrets/azure-blob-storage-connection-string
      DB_URL: postgresql+asyncpg://${APP_DB_USER}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB_NAME}
    networks:
      - backend
      - database
      - development
    depends_on:
      - redis
      - db

  post-dispatcher:
    build:
      context: .
      dockerfile: services/post-dispatcher/Dockerfile
    restart: unless-stopped
    ports:
      - "8001:80"
    networks:
      - backend
      - development
    depends_on:
      - redis
      - post-worker

  test-runner:
    build:
      context: .
      dockerfile: test/Dockerfile
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # Required for testcontainers
    environment:
      - TESTCONTAINERS_HOST_OVERRIDE=host.docker.internal  
    profiles:
      - test  # Only runs when explicitly requested

