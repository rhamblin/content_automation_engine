services:
  redis:
    image: redis:latest
    restart: unless-stopped
    networks: 
      - backend

  pin-generation-scheduler:
    build:
      context: ./services/pin-generation-scheduler
    restart: unless-stopped
    networks:
      - backend
    depends_on:
      - pin-dispatcher

  pin-worker:
    build:
      context: ./services/pin-worker
    restart: unless-stopped
    secrets:
      - open-ai-api-key
    environment:
      OPENAI_API_KEY: /run/secrets/open-ai-api-key
    networks:
      - backend
      - database
    depends_on:
      - redis

  pin-dispatcher:
    build:
      context: ./services/pin-dispatcher
    restart: unless-stopped
    ports:
      - "8001:80"
    networks:
      - backend
    depends_on:
      - redis
      - pin-worker

  niches-api:
    build:
      context: ./services/niches-api
    restart: unless-stopped
    environment:
      DB_URL: postgresql+asyncpg://${APP_DB_USER}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "8002:80"
    networks:
      - backend
      - database
    depends_on:
      - db

  db:
    image: postgres:16-alpine3.22
    restart: unless-stopped
    environment:
      POSTGRES_USER:     "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB:       "${POSTGRES_DB}"
      APP_DB_USER:       "${APP_DB_USER}"
      APP_DB_PASSWORD:   "${APP_DB_PASSWORD}"
      ANALYTICS_DB_USER: "${ANALYTICS_DB_USER}"
      ANALYTICS_DB_PASSWORD: "${ANALYTICS_DB_PASSWORD}"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - database
  
  blob-storage:
    image: mcr.microsoft.com/azure-storage/azurite
    command: "azurite-blob --blobHost 0.0.0.0"
    ports:
      - "10000:10000"
    volumes:
      - blob_storage:/data
    networks:
      - database
    
secrets:
  open-ai-api-key:
    file: ./secrets/openai-apikey.txt

volumes:
  db_data:
    name: "${APP_NAME}_${APP_ENV}_db_data"
  blob_storage:
    name: "${APP_NAME}_${APP_ENV}_blob_storage"

networks:
  database:
  backend: