services:
  redis:
    image: redis:latest
    restart: unless-stopped
    networks:
      - backend

  post-generation-scheduler:
    build:
      context: .
      dockerfile: services/post-generation-scheduler/Dockerfile
    restart: unless-stopped
    networks:
      - backend
    depends_on:
      - post-dispatcher

  post-worker:
    build:
      context: .
      dockerfile: services/post-worker/Dockerfile
    restart: unless-stopped
    secrets:
      - open-ai-api-key
    environment:
      OPENAI_API_KEY: /run/secrets/open-ai-api-key
      UNSPLASH_ACCESSKEY: /run/secrets/unsplash-access-key
      UNSPLASH_SECRETKEY: /run/secrets/unsplash-secret-key
      DB_URL: postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB}
    networks:
      - backend
      - database
    depends_on:
      - redis
      - db

  post-dispatcher:
    build:
      context: .
      dockerfile: services/post-dispatcher/Dockerfile
    restart: unless-stopped
    ports:
      - "8001:80"
    networks:
      - backend
    depends_on:
      - redis
      - post-worker

