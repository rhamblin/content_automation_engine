[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "common"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    # Database
    "SQLAlchemy>=2.0.30,<3.0.0",
    "asyncpg>=0.29.0,<1.0.0",
    "psycopg2-binary>=2.9,<3.0",
    # Message queue
    "redis",
    # Provider SDKs
    "azure-storage-blob>=12.0.0",
    "openai",
    "requests>=2.28.0",
    # Retry logic
    "tenacity>=8.0.0",
    # Auth
    "PyJWT[crypto]>=2.8.0",
    # Terminal UI
    "rich>=13.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
